<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | JayJay Neon Quest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-neon text-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card card-glass neon-border">
        <div class="card-body p-4">
          <h3 class="fw-bold mb-2">⚡ JayJay Neon Quest</h3>
          <p class="text-secondary mb-4">Entre e comece a upar no brilho da cidade.</p>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for cat, msg in messages %}
                <div class="alert alert-{{cat}} alert-glass">{{ msg }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="post">
            <div class="mb-3">
              <label class="form-label">Usuário</label>
              <input class="form-control" name="username" placeholder="admin" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Senha</label>
              <input class="form-control" type="password" name="password" placeholder="admin123" required>
            </div>
            <button class="btn btn-neon w-100">Entrar</button>
          </form>

          <div class="mt-3 text-secondary small">
            Primeiro acesso: <b>admin / admin123</b>
          </div>
        </div>
      </div>
      <div class="text-center text-secondary small mt-3">
        Dica: troque a senha em Config.
      </div>
    </div>
  </div>
</div>
</body>
</html>
